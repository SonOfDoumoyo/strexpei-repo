# Local stack: Postgres, Redis, the API and the web app.
#   cp backend/.env.example backend/.env   # then fill it in
#   docker compose up --build
# Web: http://localhost:5173   API: http://localhost:8000/docs
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: streixpei
      POSTGRES_USER: streixpei
      POSTGRES_PASSWORD: streixpei
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streixpei -d streixpei"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://streixpei:streixpei@db:5432/streixpei
      REDIS_URL: redis://redis:6379/0
      FRONTEND_URL: http://localhost:5173
      API_URL: http://localhost:8000
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
