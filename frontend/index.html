<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Streixpei — Payroll for Nigerian businesses</title>
    <meta name="description" content="Create a workgroup, share one link with your staff, and pay everyone from one wallet. Staff register with their staff ID — no accounts needed." />
    <meta name="theme-color" content="#F7F3EC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#100E0B" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved light/dark preference before first paint (no flash).
      try {
        var mode = localStorage.getItem("spx.mode");
        if (mode === "dark" || (!mode && location.pathname === "/")) {
          document.documentElement.dataset.mode = "dark";
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Streixpei needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
